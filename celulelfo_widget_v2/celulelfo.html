
<link href="https://fonts.googleapis.com/css?family={fontName}:400,{fontWeight}" rel="stylesheet">
<div class="main-container">
    <div class="meter">
        <div class="battery">
            <span id="bar"></span>
        </div>
        <div id="sparkles" aria-hidden="true"></div>
    </div>
    <div class="legend">
        <div class="legend-content">
            <div class="title" id="title">{{titleText}}</div>
            <div class="values">
                <span id="count"></span>
                <span id="divider">{divider}</span>
                <span id="goal"></span>
            </div>
        </div>
    </div>
</div>
